<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vajra VPN</title>
    <style>
        body { 
            background-color: #1e1e2e; 
            color: white; 
            font-family: Arial, sans-serif; 
            text-align: center; 
            padding-top: 60px; 
        }
        h1 { color: #00ffcc; font-size: 28px; }
        .sub { color: #aaaaaa; font-size: 14px; margin-bottom: 40px; }
        .status { font-size: 18px; margin: 30px 0; color: #ff5555; font-weight: bold; }
        button { 
            padding: 15px 35px; 
            font-size: 18px; 
            font-weight: bold; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            color: white; 
            margin: 10px; 
            display: block;
            width: 80%;
            max-width: 300px;
            margin-left: auto;
            margin-right: auto;
        }
        .connect-btn { background-color: #00aa55; }
        .disconnect-btn { background-color: #aa0000; }
    </style>
</head>
<body>
    <h1>⚡ VAJRA VPN ⚡</h1>
    <div class="sub">Private & Ultra-Fast Secure Tunnel</div>
    
    <div class="status" id="status">Status: Disconnected</div>
    
    <button class="connect-btn" onclick="connectVPN()">CONNECT VPN</button>
    <button class="disconnect-btn" onclick="disconnectVPN()">DISCONNECT</button>

    <script>
        let ws;
        function connectVPN() {
            document.getElementById("status").innerText = "Status: Connecting...";
            document.getElementById("status").style.color = "#ffaa00";
            
            // Render WebSocket server link
            ws = new WebSocket("wss://vajra-vpn.onrender.com/connect");

            ws.onopen = function() {
                document.getElementById("status").innerText = "Status: Connected & Secured 🚀";
                document.getElementById("status").style.color = "#55ff55";
            };

            ws.onclose = function() {
                document.getElementById("status").innerText = "Status: Disconnected";
                document.getElementById("status").style.color = "#ff5555";
            };

            ws.onerror = function() {
                document.getElementById("status").innerText = "Status: Connection Failed!";
                document.getElementById("status").style.color = "#ff5555";
            };
        }

        function disconnectVPN() {
            if (ws) {
                ws.close();
            }
            document.getElementById("status").innerText = "Status: Disconnected";
            document.getElementById("status").style.color = "#ff5555";
        }
    </script>
</body>
</html>
